name: Publish @octelium/sdk

on:
  push:
    tags:
      - "sdk/ts/v*" # stable release:  sdk/ts/v1.0.0
      - "sdk/ts/pre/*" # pre-release:     sdk/ts/pre/20260320.1

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == sdk/ts/v* ]]; then
            VERSION="${TAG#sdk/ts/v}"
            IS_RELEASE=true
          else
            DATE="${TAG#sdk/ts/pre/}"
            VERSION="1.0.0-pre.${DATE}"
            IS_RELEASE=false
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION (is_release=$IS_RELEASE)"

      - name: Update version in package.json
        working-directory: packages/sdk
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Install dependencies
        working-directory: packages/sdk
        run: npm install

      - name: Build
        working-directory: packages/sdk
        run: npm run build

      - name: Publish stable
        if: steps.version.outputs.is_release == 'true'
        working-directory: packages/sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish pre-release
        if: steps.version.outputs.is_release == 'false'
        working-directory: packages/sdk
        run: npm publish --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
