name: Publish @octelium/sdk

on:
  push:
    tags:
      - "sdk/ts/v*" # stable release:  sdk/ts/v1.0.0
      - "sdk/ts/pre/*" # pre-release:     sdk/ts/pre/20260320.1

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == sdk/ts/v* ]]; then
            VERSION="${TAG#sdk/ts/v}"
            IS_RELEASE=true
          else
            DATE="${TAG#sdk/ts/pre/}"
            VERSION="1.0.0-pre.${DATE}"
            IS_RELEASE=false
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION (is_release=$IS_RELEASE)"

      - name: Verify package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("packages/sdk/package.json", "utf8"));
            if (version !== process.env.VERSION) throw new Error(`Package version ${version} does not match tag version ${process.env.VERSION}`);
          '

      - name: Install dependencies
        run: npm ci

      - name: Check packages
        run: |
          npm run check
          npm run check:package

      - name: Publish stable
        if: steps.version.outputs.is_release == 'true'
        working-directory: packages/sdk
        run: npm publish --access public --provenance

      - name: Publish pre-release
        if: steps.version.outputs.is_release == 'false'
        working-directory: packages/sdk
        run: npm publish --access public --tag next --provenance
